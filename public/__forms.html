<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Support form registration</title></head>
<body>
  <form name="refund-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="refund-request">
    <input name="bot-field">
    <input name="firstName">
    <input name="lastName">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input name="transactionId">
    <select name="reason"><option>Other</option></select>
    <textarea name="details"></textarea>
    <input name="acknowledge" type="checkbox" value="agreed">
  </form>
</body>
</html>
